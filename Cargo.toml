[workspace]
resolver = "2"
members = ["crates/dice-core", "crates/dice-wasm", "crates/dice-cli"]

[profile.release]
# Smaller wasm binaries, at the cost of slower release builds.
lto = true
codegen-units = 1

[workspace.package]
license = "MIT"
repository = "https://github.com/alex-kennedy/dice"
description = "Dice rolling distribution calculations."
